name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · format · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Advisory only: known advisories in the dependency tree are reported, not blocking.
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level=high
        continue-on-error: true
